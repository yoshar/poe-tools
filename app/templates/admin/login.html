{% extends "base.html" %}
{% block content %}
<h1>Admin login</h1>
{% if error %}<p class="warn">Wrong password.</p>{% endif %}
<form method="post" action="/admin/login" class="stack">
  <label>Password <input type="password" name="password" autofocus required></label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
